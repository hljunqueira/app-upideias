<h1 class="font-headline-lg-mobile md:font-headline-lg text-white mb-xs">Entrar no UP Analytics</h1>
<p class="font-body-md text-on-surface-variant">Acesse suas métricas, estratégias e conteúdos.</p>

<form class="space-y-md">
<div>
<label class="block font-label-md text-on-surface-variant mb-base" for="email">E-mail</label>
<input class="w-full rounded-lg input-dark text-white font-body-md px-md py-sm outline-none transition-colors" id="email" placeholder="seu@email.com" required="" type="email">
</div>
<div>
<div class="flex justify-between items-center mb-base">
<label class="block font-label-md text-on-surface-variant" for="password">Senha</label>
<a class="font-label-md text-coral-primary hover:text-coral-hover transition-colors" href="#">Esqueci minha senha</a>
</div>
<input class="w-full rounded-lg input-dark text-white font-body-md px-md py-sm outline-none transition-colors" id="password" placeholder="••••••••" required="" type="password">
</div>
<button class="w-full btn-coral rounded-lg py-sm font-label-md flex justify-center items-center gap-xs transition-colors mt-lg" type="submit">
                    Entrar
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<div class="mt-xl text-center md:text-left">
<span class="font-body-md text-on-surface-variant">Não tem uma conta?</span>
<a class="font-label-md text-coral-primary hover:text-coral-hover ml-xs transition-colors" href="#">Criar conta</a>
</div>
</div>

<div class="w-12 h-1 bg-coral-primary mx-auto rounded-full mt-lg opacity-50"></div>
